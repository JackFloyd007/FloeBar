name: Lint Swift Files
on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/lint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - ".swiftlint.yml"
      - "**/*.swift"
jobs:
  swiftlint:
    if: '!github.event.pull_request.merged'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install SwiftLint 0.65.1
        env:
          SWIFTLINT_SHA256: c1e429b0599cf1b516f369a2d9ec04eaf0e436f3c12b637df8851fa52ff694d0
        run: |
          curl --fail --location --retry 3 \
            https://github.com/realm/SwiftLint/releases/download/0.65.1/portable_swiftlint.zip \
            --output "$RUNNER_TEMP/swiftlint.zip"
          echo "$SWIFTLINT_SHA256  $RUNNER_TEMP/swiftlint.zip" | shasum -a 256 --check
          unzip -q "$RUNNER_TEMP/swiftlint.zip" -d "$RUNNER_TEMP/swiftlint"
          test "$("$RUNNER_TEMP/swiftlint/swiftlint" version)" = "0.65.1"
      - name: Run SwiftLint
        run: '"$RUNNER_TEMP/swiftlint/swiftlint" lint --strict'
